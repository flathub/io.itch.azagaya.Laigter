app-id: io.itch.azagaya.Laigter
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: laigter
rename-icon: laigter
rename-desktop-file: laigter.desktop
rename-appdata-file: laigter.appdata.xml

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --filesystem=home
  - --device=dri

modules:
  - name: laigter
    buildsystem: qmake

    sources:
      - type: archive
        url: https://github.com/azagaya/laigter/archive/refs/tags/UNKNOWN@2026-08-07_1786113264.tar.gz
        sha256: d7e67f6d8a1f7a4a1b3d1b526c260c97178a3dfe4bbe14c7b3d0e07a11582aac
        x-checker-data:
          type: json
          url: https://api.github.com/repos/azagaya/laigter/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: |
            "https://github.com/azagaya/laigter/archive/refs/tags/" + .tag_name + ".tar.gz"
          timestamp-query: .published_at

      - type: patch
        path: appdata-fixes.patch

    post-install:
      - sed -i 's/<icon name="laigter"/<icon name="$FLATPAK_ID"/' dist/x-laigter-project.xml
      - install -Dm644 dist/x-laigter-project.xml /app/share/mime/packages/$FLATPAK_ID.xml
